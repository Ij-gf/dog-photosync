org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# AGP 9 内置 Kotlin 与 KSP（Room 代码生成）需要放开 kotlin.sourceSets 写入限制
android.disallowKotlinSourceSets=false

# ------------------------------------------------------------------
# Supabase 配置（也可写在 local.properties 中，local.properties 优先）
# 后台账号密码不要写进版本库
# ------------------------------------------------------------------
SUPABASE_URL=
SUPABASE_ANON_KEY=
# 可选：自动登录账号（填了才会带 user_id 上传）
SUPABASE_EMAIL=
SUPABASE_PASSWORD=

# 本机已装 android-37.0 平台，AGP 9.1.0 尚未将其列入官方兼容表
android.suppressUnsupportedCompileSdk=37.0

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 新 DSL 的优化开关（R8 全量优化 + 资源裁剪）
android.r8.gradual.support=true
